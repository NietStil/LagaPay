<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Bar terminal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#d8b4fe}a:hover{color:#e9d5ff}
@keyframes nfcPulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.nfc-ring{animation:nfcPulse 1.8s cubic-bezier(.2,.7,.3,1) infinite}
.nfc-ring-2{animation-delay:.9s}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet{animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
.tile{transition:border-color .15s,transform .12s}
.tile:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){.nfc-ring,.sheet{animation:none}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;box-sizing:border-box;background:#09090b;color:#fafafa;font-family:-apple-system,system-ui,'Segoe UI',sans-serif;display:flex;flex-direction:column">

<div style="padding:56px 20px 0;display:flex;flex-direction:column;gap:14px">

<div role="tablist" aria-label="Categorie" style="display:flex;padding:4px;background:#18181b;border:1px solid #27272a;border-radius:14px">
<sc-for list="{{chips}}" as="chip" hint-placeholder-count="3">
<button type="button" role="tab" onClick="{{chip.pick}}" aria-selected="{{chip.pressed}}" style="flex:1;height:40px;padding:0 8px;border:0;border-radius:10px;background:{{chip.bg}};color:{{chip.fg}};font:inherit;font-size:14px;font-weight:600;cursor:pointer">{{chip.label}}</button>
</sc-for>
</div>

</div>

<div style="flex:1;min-height:0;overflow-y:auto;padding:16px 20px 12px">
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding:56px 24px;text-align:center;border:1px dashed #3f3f46;border-radius:20px;background:#131316">
<div style="font-size:15px;font-weight:600">Geen producten gevonden</div>
<div style="margin-top:4px;font-size:13px;color:#a1a1aa">Er staan nog geen producten in deze categorie.</div>
</div>
</sc-if>
<div style="display:grid;grid-template-columns:{{gridCols}};gap:10px">
<sc-for list="{{producten}}" as="p" hint-placeholder-count="9">
<div style="position:relative">
<button type="button" class="tile" onClick="{{p.add}}" aria-label="{{p.aria}}" style="width:100%;min-height:104px;display:flex;flex-direction:column;padding:12px;box-sizing:border-box;background:#18181b;border:1.5px solid {{p.bd}};border-radius:18px;color:inherit;font:inherit;text-align:left;cursor:pointer">
<span style="display:flex;align-items:flex-start;justify-content:space-between;gap:6px">
<span style="font-size:15px;font-weight:600;line-height:1.25;text-wrap:pretty">{{p.naam}}</span>
<sc-if value="{{p.inCart}}" hint-placeholder-val="{{ false }}">
<span style="flex-shrink:0;min-width:24px;height:24px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:{{accent}};color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center">{{p.qty}}</span>
</sc-if>
</span>
<span style="margin-top:auto;padding-top:10px;font-size:14px;font-weight:700;color:#d8b4fe">{{p.prijs}} munten</span>
</button>
</div>
</sc-for>
</div>
</div>

<div style="padding:10px 20px 12px;border-top:1px solid #18181b;display:flex;flex-direction:column;gap:10px">
<sc-if value="{{hasCart}}" hint-placeholder-val="{{ false }}">
<div class="sheet" style="background:#18181b;border:1px solid #27272a;border-radius:20px;box-shadow:0 -12px 32px rgba(0,0,0,.45);overflow:hidden">
<div style="max-height:192px;overflow-y:auto;padding:0 6px 0 16px">
<sc-for list="{{regels}}" as="r" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid #27272a">
<span style="min-width:30px;height:26px;border-radius:8px;background:#09090b;border:1px solid #27272a;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#d4d4d8">{{r.qty}}×</span>
<span style="flex:1;min-width:0;font-size:15px;font-weight:600">{{r.naam}}</span>
<span style="font-size:14px;font-weight:700;color:#d8b4fe">{{r.sub}} munten</span>
<button type="button" onClick="{{r.verwijder}}" aria-label="{{r.aria}}" style="width:44px;height:44px;flex-shrink:0;padding:0;border:0;border-radius:12px;background:transparent;color:#fda4af;display:flex;align-items:center;justify-content:center;cursor:pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M10 11v6M14 11v6"></path><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"></path><path d="M9 7V4h6v3"></path></svg>
</button>
</div>
</sc-for>
</div>
<div style="padding:8px">
<button type="button" onClick="{{openSheet}}" style="width:100%;height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 10px 0 18px;border:0;border-radius:14px;background:{{accent}};color:#fff;font:inherit;cursor:pointer">
<span style="font-size:16px;font-weight:700">Afrekenen</span>
<span style="padding:8px 12px;border-radius:11px;background:rgba(9,9,11,.28);font-size:14px;font-weight:700">{{total}} munten</span>
</button>
</div>
</div>
</sc-if>
<sc-if value="{{noCart}}" hint-placeholder-val="{{ true }}">
<button type="button" disabled style="width:100%;height:56px;display:flex;align-items:center;justify-content:center;border:1px solid #27272a;border-radius:16px;background:#18181b;color:#71717a;font:inherit;font-size:15px;font-weight:600">Tik op een product om te beginnen</button>
</sc-if>
</div>

<nav aria-label="Hoofdmenu" style="height:82px;box-sizing:border-box;padding:8px 8px 22px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#09090b;border-top:1px solid #27272a">
<a href="Transacties.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#a1a1aa;font-size:11px;font-weight:600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
Transacties
</a>
<a href="#" aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#d8b4fe;font-size:11px;font-weight:600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg>
Producten
</a>
<a href="Scan.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#a1a1aa;font-size:11px;font-weight:600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M7 12h10"></path></svg>
Scan
</a>
<a href="#" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#a1a1aa;font-size:11px;font-weight:600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"></path><path d="M10 16l-4-4 4-4"></path><path d="M6 12h10"></path></svg>
Verlaten
</a>
</nav>

<sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;background:rgba(0,0,0,.62);display:flex;flex-direction:column;justify-content:flex-end">
<div class="sheet" role="dialog" aria-label="Betaling" style="background:#18181b;border-top:1px solid #27272a;border-radius:28px 28px 0 0;padding:10px 20px 34px;display:flex;flex-direction:column;gap:18px">
<div style="width:40px;height:5px;border-radius:999px;background:#3f3f46;align-self:center"></div>

<div style="display:flex;align-items:center;justify-content:space-between">
<div style="font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:#a1a1aa">Bestelling</div>
<sc-if value="{{pending}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{closeSheet}}" style="height:44px;padding:0 4px;border:0;background:transparent;color:#d8b4fe;font:inherit;font-size:14px;font-weight:600;cursor:pointer">Wijzigen</button>
</sc-if>
</div>

<div style="display:flex;flex-direction:column;gap:10px;max-height:168px;overflow-y:auto">
<sc-for list="{{regels}}" as="r" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:12px;font-size:15px">
<span style="min-width:30px;height:26px;border-radius:8px;background:#09090b;border:1px solid #27272a;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#d4d4d8">{{r.qty}}×</span>
<span style="flex:1;font-weight:600">{{r.naam}}</span>
<span style="font-weight:700;color:#d4d4d8">{{r.sub}}</span>
</div>
</sc-for>
</div>

<div style="display:flex;align-items:baseline;justify-content:space-between;padding-top:14px;border-top:1px solid #27272a">
<span style="font-size:15px;color:#a1a1aa">Totaal</span>
<span style="font-size:34px;font-weight:800;letter-spacing:-.8px">{{total}} munten</span>
</div>

<sc-if value="{{pending}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{pay}}" style="position:relative;overflow:hidden;width:100%;padding:28px 20px 22px;border:1px dashed #3f3f46;border-radius:22px;background:#131316;color:#fafafa;font:inherit;display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer">
<span style="position:relative;width:88px;height:88px;display:flex;align-items:center;justify-content:center">
<span class="nfc-ring" style="position:absolute;inset:0;border-radius:999px;border:2px solid {{accent}}"></span>
<span class="nfc-ring nfc-ring-2" style="position:absolute;inset:0;border-radius:999px;border:2px solid {{accent}}"></span>
<span style="position:relative;width:64px;height:64px;border-radius:999px;background:{{accent}};display:flex;align-items:center;justify-content:center;color:#fff">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 7.5a6 6 0 0 1 0 9"></path><path d="M12 5a9.5 9.5 0 0 1 0 14"></path><path d="M5 10a2.5 2.5 0 0 1 0 4"></path><path d="M15.5 3a12.5 12.5 0 0 1 0 18"></path></svg>
</span>
</span>
<span style="font-size:16px;font-weight:700">Houd kaart of telefoon tegen dit toestel</span>
<span style="font-size:13px;color:#a1a1aa">Wachten op betaling…</span>
</button>
</sc-if>

<sc-if value="{{paid}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:#022c22;border:1px solid #065f46">
<span style="width:44px;height:44px;border-radius:999px;background:#34d399;color:#022c22;display:flex;align-items:center;justify-content:center;flex-shrink:0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
<span>
<span style="display:block;font-size:16px;font-weight:700;color:#6ee7b7">Betaald</span>
<span style="display:block;margin-top:2px;font-size:13px;color:#a7f3d0">{{total}} munten afgeschreven</span>
</span>
</div>
<button type="button" onClick="{{reset}}" style="height:54px;border:0;border-radius:16px;background:#fafafa;color:#3b0764;font:inherit;font-size:15px;font-weight:700;cursor:pointer">Nieuwe bestelling</button>
</div>
</sc-if>

</div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7e22ce","options":["#7e22ce","#6b21a8","#a21caf","#be123c"]},"kolommen":{"editor":"enum","default":"3","options":["2","3"]},"$preview":{"width":390,"height":844}}'>
const BAR_PRODUCTEN = [
  { id: 'pils', naam: 'Pilsner Urquell', prijs: 3, soort: 'bier', adult: true },
  { id: 'mojito', naam: 'Mojito Special', prijs: 6, soort: 'cocktail', adult: true },
  { id: 'rood', naam: 'Huiswijn Rood', prijs: 4, soort: 'wijn', adult: true },
  { id: 'wit', naam: 'Huiswijn Wit', prijs: 4, soort: 'wijn', adult: true },
  { id: 'aperol', naam: 'Aperol Spritz', prijs: 5, soort: 'cocktail', adult: true },
  { id: 'cola', naam: 'Cola Zero', prijs: 2, soort: 'fris', adult: false },
  { id: 'gt', naam: 'Gin & Tonic', prijs: 6, soort: 'cocktail', adult: true },
  { id: 'spa', naam: 'Spa Rood', prijs: 2, soort: 'fris', adult: false },
  { id: 'espresso', naam: 'Espresso Martini', prijs: 6, soort: 'cocktail', adult: true },
  { id: 'fanta', naam: 'Fanta', prijs: 2, soort: 'fris', adult: false },
  { id: 'speciaal', naam: 'Speciaalbier', prijs: 4, soort: 'bier', adult: true },
  { id: 'ijsthee', naam: 'Ice Tea', prijs: 2, soort: 'fris', adult: false }
];
const BAR_CHIPS = [
  { id: 'alles', label: 'Munten', coin: true },
  { id: 'adult', label: '18+', coin: false },
  { id: 'algemeen', label: 'Algemeen', coin: false }
];

class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const qty = s.qty || {};
    const filter = s.filter || 'alles';
    const accent = this.props.accent ?? '#7e22ce';
    const kolommen = this.props.kolommen ?? '3';
    const status = s.status || 'dicht';

    const setQty = (id, n) => this.setState({ qty: { ...(this.state && this.state.qty), [id]: Math.max(0, n) } });

    const zichtbaar = BAR_PRODUCTEN.filter((p) => {
      if (filter === 'adult' && !p.adult) return false;
      if (filter === 'algemeen' && p.adult) return false;
      return true;
    });

    const producten = zichtbaar.map((p) => {
      const n = qty[p.id] || 0;
      return {
        ...p,
        qty: n,
        inCart: n > 0,
        bd: '#27272a',
        aria: p.naam + ', ' + p.prijs + ' munten, toevoegen',
        add: () => setQty(p.id, n + 1)
      };
    });

    const regels = BAR_PRODUCTEN.filter((p) => qty[p.id] > 0).map((p) => ({
      naam: p.naam, qty: qty[p.id], sub: qty[p.id] * p.prijs,
      aria: p.naam + ' verwijderen',
      verwijder: () => setQty(p.id, 0)
    }));
    const count = regels.reduce((a, r) => a + r.qty, 0);
    const total = regels.reduce((a, r) => a + r.sub, 0);

    const chips = BAR_CHIPS.map((c) => {
      const on = c.id === filter;
      return {
        ...c,
        pressed: on ? 'true' : 'false',
        bg: on ? accent : 'transparent',
        fg: on ? '#ffffff' : '#a1a1aa',
        pick: () => this.setState({ filter: c.id })
      };
    });

    return {
      accent,
      gridCols: 'repeat(' + kolommen + ', minmax(0, 1fr))',
      chips,
      producten,
      empty: producten.length === 0,
      regels,
      total,
      countLabel: count === 1 ? '1 item' : count + ' items',
      hasCart: count > 0,
      noCart: count === 0,
      sheetOpen: status !== 'dicht',
      pending: status === 'wachten',
      paid: status === 'betaald',
      openSheet: () => this.setState({ status: 'wachten' }),
      closeSheet: () => this.setState({ status: 'dicht' }),
      pay: () => this.setState({ status: 'betaald' }),
      reset: () => this.setState({ status: 'dicht', qty: {} })
    };
  }
}
</script>
</body>
</html>
